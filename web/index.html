<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Invariant 9: the NUI only loads its own bundle, `nui://` assets and the
      configured media host. No CDNs, no inline script, no remote fonts.
      `connect-src` keeps `https://fredpd` because that is how NUI callbacks are
      addressed from the browser context inside FiveM.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: nui://; media-src 'self' blob: nui://; font-src 'self'; connect-src 'self' https://fredpd; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>FredPD</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
